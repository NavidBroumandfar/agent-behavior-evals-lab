name: "Agent Behavior Safety Gate"
description: >-
  Deterministic CI safety gate for AI agents: scores saved agent outputs
  against a public behavior benchmark. Local-only.
author: "Navid Broumandfar"

branding:
  icon: "shield"
  color: "purple"

inputs:
  outputs:
    description: >-
      Path (in the consumer workspace) to saved agent outputs JSONL. In
      benchmark mode this is the adapter-output schema
      (see examples/github-action/agent_outputs.jsonl); in trace mode it is the
      bring-your-own-trace record schema (see examples/byo-trace/agent_trace.jsonl).
    required: true
  mode:
    description: >-
      benchmark: score outputs against the frozen public benchmark (default).
      trace: run the structural claim-vs-tool-log verifier over your OWN agent
      traces — no benchmark, no case_id, gates on your real traffic.
    required: false
    default: "benchmark"
  tier:
    description: "Benchmark tier to gate on: smoke, standard, or extended (benchmark mode only)."
    required: false
    default: "smoke"
  max-failures:
    description: "Maximum scored failures allowed before the gate fails."
    required: false
    default: "0"
  allow-live-local:
    description: "Accept reviewed live-local records (provenance.live_execution=true)."
    required: false
    default: "false"
  python-version:
    description: "Python version used to run the gate."
    required: false
    default: "3.11"
  redact:
    description: >-
      Trace mode: write aggregate-only artifacts (ids, verdicts, failure modes,
      counts) with every trace-derived string omitted. Use when the gate output
      leaves the environment the traces live in.
    required: false
    default: "false"
  github-token:
    description: >-
      Optional token used ONLY to post the gate summary as a pull-request
      comment when comment-on-pr is true. Needs `pull-requests: write`. Leave
      unset to post nothing (default). Never use with `pull_request_target` and
      an untrusted checkout: the summary quotes agent output, which is
      attacker-influenced content in that threat model.
    required: false
    default: ""
  comment-on-pr:
    description: >-
      Post the gate summary as a pull-request comment (requires github-token).
    required: false
    default: "false"

outputs:
  gate-passed:
    description: "true when the gate passed, false when it failed."
    value: ${{ steps.gate.outputs.gate-passed }}
  scored-count:
    description: "Number of records scored."
    value: ${{ steps.gate.outputs.scored-count }}
  pass-count:
    description: "Number of records that passed."
    value: ${{ steps.gate.outputs.pass-count }}
  fail-count:
    description: "Number of records that failed."
    value: ${{ steps.gate.outputs.fail-count }}
  summary-json:
    description: "Path to the JSON gate summary artifact."
    value: ${{ steps.gate.outputs.summary-json }}
  summary-markdown:
    description: "Path to the Markdown gate summary artifact."
    value: ${{ steps.gate.outputs.summary-markdown }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Run agent behavior safety gate
      id: gate
      shell: bash
      working-directory: ${{ github.action_path }}
      # Inputs pass through env, never inline ${{ }} in the script body,
      # so crafted input values cannot inject shell. Gate is stdlib-only;
      # no package install needed.
      env:
        GATE_OUTPUTS: ${{ inputs.outputs }}
        GATE_MODE: ${{ inputs.mode }}
        GATE_TIER: ${{ inputs.tier }}
        GATE_MAX_FAILURES: ${{ inputs.max-failures }}
        GATE_ALLOW_LIVE_LOCAL: ${{ inputs.allow-live-local }}
        GATE_REDACT: ${{ inputs.redact }}
        CONSUMER_WORKSPACE: ${{ github.workspace }}
      run: |
        case "$GATE_OUTPUTS" in
          /*) OUTPUTS_PATH="$GATE_OUTPUTS" ;;
          *)  OUTPUTS_PATH="$CONSUMER_WORKSPACE/$GATE_OUTPUTS" ;;
        esac
        ARGS=(--outputs "$OUTPUTS_PATH" \
              --mode "$GATE_MODE" \
              --tier "$GATE_TIER" \
              --max-failures "$GATE_MAX_FAILURES" \
              --summary-markdown "$RUNNER_TEMP/agent_gate_summary.md" \
              --summary-json "$RUNNER_TEMP/agent_gate_summary.json")
        if [ "$GATE_ALLOW_LIVE_LOCAL" = "true" ]; then
          ARGS+=(--allow-live-local)
        fi
        if [ "$GATE_REDACT" = "true" ]; then
          ARGS+=(--redact)
        fi
        set +e
        python src/gate_check.py "${ARGS[@]}"
        STATUS=$?
        set -e
        if [ -f "$RUNNER_TEMP/agent_gate_summary.md" ]; then
          cat "$RUNNER_TEMP/agent_gate_summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        # Machine-readable outputs for downstream steps. Values come from the
        # gate's own JSON summary, never from the exit status alone.
        SUMMARY_JSON="$RUNNER_TEMP/agent_gate_summary.json"
        {
          echo "summary-json=$SUMMARY_JSON"
          echo "summary-markdown=$RUNNER_TEMP/agent_gate_summary.md"
        } >> "$GITHUB_OUTPUT"
        if [ -f "$SUMMARY_JSON" ]; then
          python -c "import json,sys;s=json.load(open(sys.argv[1]));print('gate-passed='+str(bool(s.get('gate_passed'))).lower());print('scored-count='+str(s.get('scored_count','')));print('pass-count='+str(s.get('pass_count','')));print('fail-count='+str(s.get('fail_count','')))" "$SUMMARY_JSON" >> "$GITHUB_OUTPUT"
        fi
        exit $STATUS

    - name: Comment gate summary on the pull request
      if: ${{ always() && inputs.comment-on-pr == 'true' && inputs.github-token != '' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        COMMENTS_URL: ${{ github.event.pull_request.comments_url }}
      run: |
        SUMMARY_MD="$RUNNER_TEMP/agent_gate_summary.md"
        [ -f "$SUMMARY_MD" ] || exit 0
        python -c "import json,sys;print(json.dumps({'body':open(sys.argv[1],encoding='utf-8').read()}))" "$SUMMARY_MD" > "$RUNNER_TEMP/agent_gate_comment.json"
        curl --fail --silent --show-error \
          -X POST \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          -H "Content-Type: application/json" \
          --data @"$RUNNER_TEMP/agent_gate_comment.json" \
          "$COMMENTS_URL"
