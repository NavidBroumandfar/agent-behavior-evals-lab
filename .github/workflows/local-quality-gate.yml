name: Local Quality Gate

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Lint
        run: ruff check .

      # Non-blocking until the mypy baseline is verified locally; then remove
      # continue-on-error to make type checking a hard gate.
      - name: Type check
        run: mypy
        continue-on-error: true

      # Blocking: the whole value of this project is deterministic scorer/
      # verifier correctness, so a behavioral regression in scorers.py or
      # structural_tool_verifier.py must fail the build, not merge green.
      - name: Run unit test suite
        run: python scripts/dev.py test

      - name: Run deterministic local quality gate
        run: python scripts/dev.py check
