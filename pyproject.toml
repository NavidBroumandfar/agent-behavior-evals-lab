[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-behavior-evals-lab"
version = "0.1.0"
description = "Local evaluation harness for policy-defined AI assistant and agent behavior."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-evals = "agent_evals.cli:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.13.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_evals*"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  "reports",
  "traces",
]

[tool.ruff.lint]
select = [
  "E9",
  "F63",
  "F7",
  "F82",
]
