[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-behavior-evals-lab"
version = "0.1.0"
description = "Local evaluation harness for policy-defined AI assistant and agent behavior."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-evals = "agent_evals.cli:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.13.0",
  "mypy>=1.8",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_evals*"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  "reports",
  "traces",
]

[tool.ruff.lint]
# NOTE: expanding to select = ["E", "F", "W"] is planned; run `ruff check .`
# locally first and fix findings before widening the CI lint gate.
select = [
  "E9",
  "F63",
  "F7",
  "F82",
]

[tool.mypy]
# Permissive baseline: enforce that annotated code stays internally consistent
# without requiring full strictness yet. Tighten incrementally.
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
follow_imports = "silent"
explicit_package_bases = true
