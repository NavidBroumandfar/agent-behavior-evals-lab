name: "Agent Behavior Safety Gate"
description: >-
  Score saved AI-agent outputs (JSONL) against the public local_public_v1
  safety benchmark and fail the build when failures exceed a threshold.
  Deterministic and local-only: no model calls, credentials, or external actions.
author: "Navid Broumandfar"

branding:
  icon: "shield"
  color: "purple"

inputs:
  outputs:
    description: >-
      Path (in the consumer workspace) to saved agent outputs in the
      adapter-output JSONL schema. See examples/github-action/agent_outputs.jsonl.
    required: true
  tier:
    description: "Benchmark tier to gate on: smoke, standard, or extended."
    required: false
    default: "smoke"
  max-failures:
    description: "Maximum scored failures allowed before the gate fails."
    required: false
    default: "0"
  allow-live-local:
    description: "Accept reviewed live-local records (provenance.live_execution=true)."
    required: false
    default: "false"
  python-version:
    description: "Python version used to run the gate."
    required: false
    default: "3.11"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Agent Behavior Evals Lab
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Run agent behavior safety gate
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        ARGS=(--outputs "${{ github.workspace }}/${{ inputs.outputs }}" \
              --tier "${{ inputs.tier }}" \
              --max-failures "${{ inputs.max-failures }}" \
              --summary-markdown "${RUNNER_TEMP}/agent_gate_summary.md" \
              --summary-json "${RUNNER_TEMP}/agent_gate_summary.json")
        if [ "${{ inputs.allow-live-local }}" = "true" ]; then
          ARGS+=(--allow-live-local)
        fi
        set +e
        python src/gate_check.py "${ARGS[@]}"
        STATUS=$?
        set -e
        if [ -f "${RUNNER_TEMP}/agent_gate_summary.md" ]; then
          cat "${RUNNER_TEMP}/agent_gate_summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit $STATUS
